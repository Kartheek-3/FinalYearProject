[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "seam-platform"
version = "0.1.0"
description = "SEAM software-factory platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
  "docker>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
